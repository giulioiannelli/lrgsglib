[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.12", "numpy>=1.19"]
build-backend = "scikit_build_core.build"

[project]
name = "lrgsglib"
version = "0.1.0"
authors = [
  { name="Giulio Iannelli", email="giulioiannelli.w@gmail.com" },
  { name="Pablo Villegas", email="pablo.villegas@cref.it" },
]
description = "A package containing useful classes and functions for setting up the theoretical apparatus of the Laplacian Renormalization Group for Signed Graphs"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.19.0",
    "scipy>=1.7.0",
    "networkx>=2.6.0",
    "matplotlib>=3.5.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "tqdm>=4.60.0",
    "lmfit>=1.0.0",
    "powerlaw>=1.4.0",
    "joblib>=1.0.0",
    "numba>=0.58.0",
    "python-dotenv>=1.0.0",   # config.const: load_dotenv (imported at package import)
    "plotly>=5.0.0",          # plotlib.plot3d (imported in the core import chain)
    "requests>=2.25.0",       # utils.recon.protein.io (imported in the core import chain)
]

[project.optional-dependencies]
gpu = ["cupy>=9.0.0"]
dev = [
    "pytest>=6.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "flake8>=4.0.0",
    "mypy>=0.910",
]
jupyter = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "ipywidgets>=7.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "pydata-sphinx-theme>=0.15.0",
    "sphinx-autodoc-typehints>=1.24.0",
    "myst-parser>=2.0.0",
    "sphinx-copybutton>=0.5.0",
    "sphinxcontrib-bibtex>=2.6.0",
    "sphinx-autobuild>=2021.3.14",
]

[project.urls]
"Homepage" = "https://github.com/giulioiannelli/lrgsglib"
"Bug Tracker" = "https://github.com/giulioiannelli/lrgsglib/issues"
"Documentation" = "https://github.com/giulioiannelli/lrgsglib/tree/main/docs"
"Source Code" = "https://github.com/giulioiannelli/lrgsglib"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["src/lrgsglib"]

# CMake install() DESTINATIONs are already relative to the wheel root (e.g.
# "lrgsglib/statsys/.../ccore"), so map them onto platlib ("") -> the compiled
# extensions land inside the installed package. NB: "/" is rejected as an
# absolute path by scikit-build-core >=0.11 unless experimental mode is on.
wheel.install-dir = ""

[tool.scikit-build.cmake.define]
# Pass any custom CMake variables here if needed

[tool.black]
line-length = 80
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 80
multi_line_output = 3

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "integration: tests that invoke scripts or cross-module workflows",
    "slow: tests that may take longer or write larger artifacts",
    "gpu: tests requiring a CUDA-capable device",
    "code: Just-code tests (imports, instantiation, execution)",
    "physical: Scientific correctness tests (invariants, known regimes)",
    "visual: Tests that generate plots or animations for inspection",
]
