name: Build & Test Wheels

on:
  push:
    branches: [main, dev, "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]

jobs:
  # ------------------------------------------------------------------
  # Build wheels for multiple platforms
  # ------------------------------------------------------------------
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-latest]
        # macos-13 = x86_64, macos-latest = arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.22.0

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp312-manylinux_x86_64 cp312-macosx_x86_64 cp312-macosx_arm64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_MACOS: brew install libomp
          CIBW_ENVIRONMENT_MACOS: >
            LDFLAGS="-L$(brew --prefix libomp)/lib"
            CPPFLAGS="-I$(brew --prefix libomp)/include"
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # ------------------------------------------------------------------
  # Build source distribution
  # ------------------------------------------------------------------
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: pip install build && python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ------------------------------------------------------------------
  # Test installed wheel in clean environment
  # ------------------------------------------------------------------
  test-wheel:
    name: Test wheel on ${{ matrix.os }}
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse

      - name: Install wheel
        run: pip install wheelhouse/*.whl

      - name: Test import
        run: python -c "import lrgsglib; print('lrgsglib imported successfully')"

      - name: Run quick tests
        run: |
          pip install pytest
          pytest test/ --quick -q --ignore=test/graph_tests/test_graphs_restructure.py -k "not test_ising_c_ground_state"

  # ------------------------------------------------------------------
  # Publish to PyPI (on tag push only)
  # ------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist, test-wheel]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/lrgsglib/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
