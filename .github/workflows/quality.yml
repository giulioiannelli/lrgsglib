name: Code Quality

on:
  push:
    branches: [main, dev-notebooks, "feature/**"]
  pull_request:
    branches: [main, dev-notebooks]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install black isort flake8 mypy

      - name: Check formatting (black)
        run: black --check src/lrgsglib/

      - name: Check import order (isort)
        run: isort --check src/lrgsglib/

      - name: Lint (flake8)
        run: flake8 src/lrgsglib/ --max-line-length 88 --extend-ignore E203,W503 --count --show-source --statistics

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[docs]"

      - name: Build Sphinx docs
        run: cd docs && make html SPHINXOPTS="-W --keep-going"

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest test/ --quick -q -k "not test_ising_c_ground_state"
