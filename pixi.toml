[project]
name = "lrgsglib"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
python = ">=3.12"
numpy = ">=1.19"
scipy = ">=1.7"
networkx = ">=2.6"
matplotlib = ">=3.5"
pandas = ">=1.3"
scikit-learn = ">=1.0"
tqdm = ">=4.60"
lmfit = ">=1.0"
powerlaw = ">=1.4"
joblib = ">=1.0"
numba = ">=0.58"
# Build toolchain
gcc = "*"
gxx = "*"
pybind11 = ">=2.10"
cmake = ">=3.20"
ninja = "*"

[feature.gt.dependencies]
graph-tool = "*"

[feature.gpu.dependencies]
cupy = ">=9.0"

[feature.dev.dependencies]
pytest = ">=6.0"
black = ">=22.0"
isort = ">=5.0"
mypy = ">=0.910"

[feature.docs.dependencies]
sphinx = ">=7.0"
sphinx-rtd-theme = ">=2.0"
sphinx-autodoc-typehints = ">=1.24"
myst-parser = ">=2.0"

[feature.jupyter.dependencies]
notebook = "*"
ipykernel = ">=6.0"
ipywidgets = ">=7.0"
ipympl = "*"
plotly = "*"

[environments]
default = ["dev", "jupyter"]
full = ["dev", "jupyter", "gt", "docs"]
gpu = ["dev", "gpu"]
minimal = []

[tasks]
build = "pip install -e . --no-build-isolation"
test = "pytest test/"
test-quick = "pytest test/ --quick"
lint = "black --check src && isort --check src"
docs = "cd docs && make clean && make html"
