# Conda environment for lrgsglib.
# Alternative: `pixi install` (recommended, faster). See pixi.toml in project root.
name: lrgsgenv
channels:
  - conda-forge
  - defaults
dependencies:
  # Core scientific stack
  - python=3.12
  - numpy
  - scipy
  - pandas
  - matplotlib
  - networkx
  - scikit-learn
  - tqdm

  # Graph analysis
  - graph-tool

  # Specialized scientific packages
  - lmfit
  - powerlaw
  - nilearn
  - emd

  # Performance and compilation
  - cupy
  - numba
  - joblib
  - pybind11
  - boost
  - boost-cpp
  - libboost

  # C/C++ compilers
  - gcc
  - gcc_linux-64
  - gxx_linux-64

  # Jupyter environment
  - notebook
  - ipykernel
  - ipywidgets
  - ipympl
  - nbformat
  - plotly

  # Development tools
  - pytest
  - black
  - isort
  - flake8
  - mypy

  # Documentation
  - sphinx
  - sphinx-rtd-theme
  - sphinx-autodoc-typehints
  - myst-parser
  - sphinx-copybutton
  - sphinxcontrib-bibtex

  # Environment management
  - python-dotenv
