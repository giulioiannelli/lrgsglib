# Conda environment for lrgsglib (standalone usage).
# Alternative: `pixi install` (recommended, faster). See pixi.toml in project root.
# For the outer lrgsglib-ipynb wrapper, use lrgsgnb env instead.
name: lrgsgenv
channels:
  - conda-forge
  - defaults
dependencies:
  # Core scientific stack (versions match pyproject.toml)
  - python>=3.12
  - numpy>=1.19
  - scipy>=1.7
  - pandas>=1.3
  - matplotlib>=3.5
  - networkx>=2.6
  - scikit-learn>=1.0
  - tqdm>=4.60

  # Specialized scientific packages
  - lmfit>=1.0
  - powerlaw>=1.4

  # Performance and compilation
  - numba>=0.58
  - joblib>=1.0
  - pybind11>=2.12

  # Graph analysis (optional but recommended)
  - graph-tool
  - boost
  - boost-cpp
  - libboost

  # C/C++ compilers (Linux; for macOS use platform-specific packages)
  - gcc
  - gcc_linux-64     # [linux]
  - gxx_linux-64     # [linux]

  # Jupyter environment
  - notebook
  - ipykernel>=6.0
  - ipywidgets>=7.0
  - ipympl
  - nbformat
  - plotly

  # Development tools
  - pytest>=6.0
  - black>=22.0
  - isort>=5.0
  - flake8>=4.0
  - mypy>=0.910

  # Documentation
  - sphinx>=7.0
  - sphinx-rtd-theme>=2.0
  - sphinx-autodoc-typehints>=1.24
  - myst-parser>=2.0
  - sphinx-copybutton>=0.5
  - sphinxcontrib-bibtex>=2.6

  # Environment management
  - python-dotenv
